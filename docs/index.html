<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiji IT Solutions - AI Receptionist</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 1rem; }
  .chat-container { width: 100%; max-width: 520px; background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.12); overflow: hidden; margin-top: 2rem; }
  .header { background: linear-gradient(135deg, #1e40af, #2563eb); color: white; padding: 1.2rem; text-align: center; }
  .header h1 { font-size: 1.15rem; font-weight: 600; }
  .header p { font-size: 0.8rem; opacity: 0.85; margin-top: 0.3rem; }
  .messages { height: 420px; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; scroll-behavior: smooth; }
  .msg { padding: 0.7rem 1rem; border-radius: 16px; max-width: 82%; word-wrap: break-word; line-height: 1.5; font-size: 0.95rem; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.bot { background: #f1f5f9; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.system { background: #fef3c7; color: #92400e; align-self: center; font-size: 0.82rem; border-radius: 8px; text-align: center; max-width: 95%; }
  .msg.lead { background: #ecfdf5; color: #065f46; align-self: center; font-size: 0.8rem; border-radius: 8px; text-align: left; max-width: 95%; white-space: pre-wrap; font-family: monospace; }
  .typing { align-self: flex-start; padding: 0.7rem 1.2rem; background: #f1f5f9; border-radius: 16px; border-bottom-left-radius: 4px; }
  .typing span { display: inline-block; width: 8px; height: 8px; background: #94a3b8; border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
  .input-area { display: flex; border-top: 1px solid #e2e8f0; }
  .input-area input { flex: 1; padding: 1rem; border: none; outline: none; font-size: 1rem; background: white; }
  .input-area input::placeholder { color: #94a3b8; }
  .input-area button { padding: 1rem 1.2rem; background: #2563eb; color: white; border: none; cursor: pointer; font-size: 1rem; font-weight: 500; transition: background 0.2s; }
  .input-area button:hover { background: #1d4ed8; }
  .input-area button:disabled { background: #94a3b8; cursor: not-allowed; }
  .mic-btn { background: #f1f5f9 !important; color: #475569 !important; font-size: 1.3rem !important; padding: 0.8rem 1rem !important; border-left: 1px solid #e2e8f0 !important; }
  .mic-btn:hover { background: #e2e8f0 !important; }
  .mic-btn.recording { background: #fef2f2 !important; color: #dc2626 !important; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .voice-controls { display: flex; gap: 0.5rem; padding: 0.4rem 0.6rem; background: #f8fafc; border-top: 1px solid #e2e8f0; align-items: center; justify-content: center; }
  .voice-controls label { font-size: 0.8rem; color: #64748b; cursor: pointer; display: flex; align-items: center; gap: 0.3rem; }
  .voice-controls input[type="checkbox"] { cursor: pointer; }
  .voice-controls select { font-size: 0.8rem; padding: 0.2rem 0.4rem; border: 1px solid #e2e8f0; border-radius: 4px; background: white; color: #475569; }
  .listening-bar { height: 3px; background: #e2e8f0; overflow: hidden; }
  .listening-bar .fill { height: 100%; width: 0; background: #dc2626; transition: width 0.1s; }
  .actions { display: flex; gap: 0.5rem; padding: 0.6rem; justify-content: center; background: #f8fafc; }
  .actions button { padding: 0.5rem 1.2rem; border-radius: 8px; border: 1px solid #e2e8f0; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; background: white; }
  .actions button:hover { border-color: #2563eb; color: #2563eb; }
  .actions .end-btn { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
  .actions .end-btn:hover { background: #dc2626; color: white; }
  .actions .new-btn { background: #f0fdf4; color: #16a34a; border-color: #bbf7d0; }
  .actions .new-btn:hover { background: #16a34a; color: white; }
  .status { text-align: center; padding: 0.4rem; font-size: 0.75rem; color: #64748b; background: #f8fafc; }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 4px; vertical-align: middle; }
  .no-speech { display: none; text-align: center; padding: 0.5rem; font-size: 0.78rem; color: #dc2626; background: #fef2f2; }
</style>
</head><body>

<div class="chat-container">
  <div class="header">
    <h1>Fiji IT Solutions</h1>
    <p>AI Receptionist - Live Demo</p>
  </div>
  <div class="status"><span class="dot"></span><span id="statusText">Receptionist online</span></div>
  <div class="no-speech" id="noSpeech">Your browser doesn't support speech recognition. Use Chrome or Edge for voice input.</div>
  <div class="messages" id="messages"></div>
  <div class="listening-bar" id="listenBar"><div class="fill" id="listenFill"></div></div>
  <div class="input-area">
    <input id="input" placeholder="Type or tap the mic..." autocomplete="off">
    <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="Hold to talk, or tap to toggle">🎤</button>
    <button id="sendBtn" onclick="send()">Send</button>
  </div>
  <div class="voice-controls">
    <label><input type="checkbox" id="speakToggle" checked> Speak replies</label>
    <label><input type="checkbox" id="autoMicToggle"> Auto-listen</label>
    <select id="voiceSelect" title="Voice"></select>
  </div>
  <div class="actions">
    <button class="end-btn" onclick="endCall()">End Call &amp; Extract Lead</button>
    <button class="new-btn" onclick="newCall()">New Call</button>
  </div>
</div>

<script>
const msgsEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const speakToggle = document.getElementById('speakToggle');
const autoMicToggle = document.getElementById('autoMicToggle');
const voiceSelect = document.getElementById('voiceSelect');
const statusText = document.getElementById('statusText');
const listenFill = document.getElementById('listenFill');
const noSpeechEl = document.getElementById('noSpeech');

let messages = [];
let collected = { name: false, phone: false, email: false, requirement: false };
let ended = false;
let isRecording = false;
let recognition = null;
let isSpeaking = false;

// ── Speech Recognition Setup ──
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onstart = () => {
    isRecording = true;
    micBtn.classList.add('recording');
    micBtn.textContent = '⏹';
    statusText.textContent = 'Listening...';
    listenFill.style.width = '100%';
    listenFill.style.background = '#dc2626';
  };

  recognition.onresult = (e) => {
    let interim = '';
    let final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        final += e.results[i][0].transcript;
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    inputEl.value = final || interim;
    if (final) {
      send();
    }
  };

  recognition.onerror = (e) => {
    if (e.error !== 'no-speech' && e.error !== 'aborted') {
      console.error('Speech error:', e.error);
    }
    stopMic();
  };

  recognition.onend = () => {
    stopMic();
  };
} else {
  noSpeechEl.style.display = 'block';
  micBtn.disabled = true;
  micBtn.style.opacity = '0.4';
}

// ── Speech Synthesis Setup ──
const synth = window.speechSynthesis;
let voices = [];

function loadVoices() {
  voices = synth.getVoices();
  voiceSelect.innerHTML = '';
  const english = voices.filter(v => v.lang.startsWith('en'));
  const toShow = english.length > 0 ? english : voices.slice(0, 10);
  toShow.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.dataset.voiceIndex = voices.indexOf(v);
    const label = v.name.replace(/Microsoft |Google |Apple /g, '');
    opt.textContent = label.length > 25 ? label.slice(0, 25) + '...' : label;
    voiceSelect.appendChild(opt);
  });
  // Try to pick a good female voice by default
  const preferred = toShow.findIndex(v =>
    /samantha|karen|zira|female|fiona|moira|victoria|susan/i.test(v.name)
  );
  if (preferred >= 0) voiceSelect.selectedIndex = preferred;
}

synth.onvoiceschanged = loadVoices;
loadVoices();

function speak(text) {
  if (!speakToggle.checked || !synth) return Promise.resolve();
  return new Promise(resolve => {
    synth.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1.05;
    utter.pitch = 1.1;
    const selectedOpt = voiceSelect.options[voiceSelect.selectedIndex];
    if (selectedOpt && voices.length) {
      utter.voice = voices[parseInt(selectedOpt.dataset.voiceIndex)];
    }
    isSpeaking = true;
    statusText.textContent = 'Speaking...';
    utter.onend = () => {
      isSpeaking = false;
      statusText.textContent = 'Receptionist online';
      resolve();
      if (autoMicToggle.checked && !ended) {
        setTimeout(() => toggleMic(), 400);
      }
    };
    utter.onerror = () => { isSpeaking = false; resolve(); };
    synth.speak(utter);
  });
}

// ── Mic Controls ──
function toggleMic() {
  if (!recognition) return;
  if (isSpeaking) { synth.cancel(); return; }
  if (isRecording) {
    recognition.stop();
  } else {
    inputEl.value = '';
    recognition.start();
  }
}

function stopMic() {
  isRecording = false;
  micBtn.classList.remove('recording');
  micBtn.textContent = '🎤';
  statusText.textContent = 'Receptionist online';
  listenFill.style.width = '0';
}

inputEl.addEventListener('keypress', e => { if (e.key === 'Enter') send(); });

// ── Chat Logic ──
function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  msgsEl.appendChild(d);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return d;
}

function showTyping() {
  const d = document.createElement('div');
  d.className = 'typing';
  d.id = 'typing';
  d.innerHTML = '<span></span><span></span><span></span>';
  msgsEl.appendChild(d);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function getReply(userMsg) {
  const lower = userMsg.toLowerCase();
  const userCount = messages.filter(m => m.role === 'user').length;

  if (userCount === 1) {
    return "Hello! Thank you for calling Fiji IT Solutions. I'm the virtual receptionist. How can I help you today?";
  }

  if (!collected.requirement && userMsg.length > 15) {
    collected.requirement = true;
    return "I understand, I'll make sure a technician follows up on that. Could I get your full name please?";
  }
  if (!collected.requirement && userMsg.length > 8) {
    collected.requirement = true;
    return "Got it, I've noted that down. May I have your full name please?";
  }

  if (!collected.name) {
    const words = userMsg.trim().split(/\s+/);
    if (words.length >= 2 || (words.length === 1 && words[0][0] === words[0][0].toUpperCase())) {
      collected.name = true;
      const name = words.map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
      return `Thank you, ${name}! And what's the best phone number to reach you at?`;
    }
    return "Could I get your full name please?";
  }

  if (!collected.phone && /\d/.test(lower)) {
    collected.phone = true;
    const digits = userMsg.replace(/\D/g, '');
    const formatted = digits.length >= 7 ? digits : userMsg;
    return `Got it, ${formatted}. And could I get your email address?`;
  }
  if (!collected.phone) return "What's the best phone number to reach you at?";

  if (!collected.email && /@/.test(lower)) {
    collected.email = true;
    const emailMatch = userMsg.match(/[\w.+-]+@[\w.-]+\.\w+/);
    const email = emailMatch ? emailMatch[0].toLowerCase() : userMsg.toLowerCase().trim();
    return `Let me confirm: ${email} — is that correct? I've got all your details. A technician will follow up with you shortly. Is there anything else I can help you with?`;
  }
  if (!collected.email) return "Could I get your email address please?";

  if (all()) {
    if (/no|nope|that'?s? (all|it)|nothing|goodbye|bye|thanks/i.test(lower)) {
      ended = true;
      return "Thank you for calling Fiji IT Solutions! We appreciate your time. A technician will be in touch shortly. Have a wonderful day!";
    }
    return "Is there anything else I can help you with today?";
  }

  return "Could you tell me a bit more about what you need help with?";
}

function all() { return collected.name && collected.phone && collected.email && collected.requirement; }

function extractLead() {
  const transcript = messages.filter(m => m.role !== 'system');
  let lead = { first_name: '', last_name: '', phone: '', email: '', requirement: '', urgency: 'low' };
  const allText = transcript.map(m => m.content).join('\n');

  const emailMatch = allText.match(/[\w.+-]+@[\w.-]+\.\w+/);
  if (emailMatch) lead.email = emailMatch[0].toLowerCase();

  const phoneMatch = allText.match(/[\d][\d\s\-().]{5,}[\d]/);
  if (phoneMatch) lead.phone = phoneMatch[0].replace(/\D/g, '');

  const userMsgs = transcript.filter(m => m.role === 'user').map(m => m.content);
  for (const msg of userMsgs) {
    const words = msg.trim().split(/\s+/);
    if (words.length >= 2 && words.length <= 4) {
      const allCap = words.every(w => /^[A-Z]/.test(w));
      if (allCap && !/@/.test(msg) && !/\d{3}/.test(msg)) {
        lead.first_name = words[0];
        lead.last_name = words.slice(1).join(' ');
        break;
      }
    }
  }
  for (const msg of userMsgs) {
    if (msg.length > 15 && !/@/.test(msg) && !/^\d/.test(msg.trim())) {
      const words = msg.trim().split(/\s+/);
      const allCap = words.every(w => /^[A-Z]/.test(w));
      if (!allCap || words.length > 4) { lead.requirement = msg.trim(); break; }
    }
  }
  if (/urgent|emergency|down|critical|asap|can'?t work/i.test(lead.requirement)) lead.urgency = 'high';
  else if (/slow|issue|problem|broken|error/i.test(lead.requirement)) lead.urgency = 'medium';
  return lead;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || ended) return;
  inputEl.value = '';
  sendBtn.disabled = true;

  messages.push({ role: 'user', content: text });
  addMsg(text, 'user');

  showTyping();
  await new Promise(r => setTimeout(r, 500 + Math.random() * 600));
  hideTyping();

  const reply = getReply(text);
  messages.push({ role: 'assistant', content: reply });
  addMsg(reply, 'bot');
  sendBtn.disabled = false;

  await speak(reply);
  if (!autoMicToggle.checked) inputEl.focus();
}

function endCall() {
  if (messages.length < 2) return;
  synth.cancel();
  ended = true;
  addMsg('--- Call ended, extracting lead... ---', 'system');
  const lead = extractLead();
  const summary =
`EXTRACTED LEAD:
  Name:        ${lead.first_name} ${lead.last_name}
  Phone:       ${lead.phone || '(not provided)'}
  Email:       ${lead.email || '(not provided)'}
  Requirement: ${lead.requirement || '(not provided)'}
  Urgency:     ${lead.urgency}`;

  const d = document.createElement('div');
  d.className = 'msg lead';
  d.textContent = summary;
  msgsEl.appendChild(d);
  msgsEl.scrollTop = msgsEl.scrollHeight;

  const missing = [];
  if (!lead.first_name) missing.push('name');
  if (!lead.phone) missing.push('phone');
  if (!lead.email) missing.push('email');
  if (!lead.requirement) missing.push('requirement');

  if (missing.length === 0) addMsg('All fields captured! This lead would be pushed to the CRM.', 'system');
  else addMsg('Missing: ' + missing.join(', ') + '. In production the receptionist would keep asking.', 'system');
}

function newCall() {
  synth.cancel();
  messages = [];
  collected = { name: false, phone: false, email: false, requirement: false };
  ended = false;
  msgsEl.innerHTML = '';
  addMsg('New call started. Tap the mic or type to begin.', 'system');
  inputEl.focus();
}

addMsg('Welcome! Tap 🎤 to talk or type below. The receptionist will speak back to you. Check "Auto-listen" for hands-free conversation.', 'system');
inputEl.focus();
</script>
</body></html>
